
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfatlas"
version = "0.1.0"
description = "Reproducible performance benchmarking and regression intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15,<1.0",
    "rich>=13.9,<15.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0"
]
dashboard = [
    "streamlit>=1.40,<2.0"
]
database = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0"
]
statistics = [
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0"
]
profiling = [
    "psutil>=6.0,<8.0"
]

[project.scripts]
perfatlas = "perfatlas.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
